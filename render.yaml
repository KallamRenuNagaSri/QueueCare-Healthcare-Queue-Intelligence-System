# ──────────────────────────────────────────────────────────────────────────────
# Render.com deployment configuration for QCare
# Docs: https://render.com/docs/blueprint-spec
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Web Service (Express + React) ────────────────────────────────────────────
  - type: web
    name: qcare
    runtime: node
    region: oregon          # change to your preferred region
    plan: free              # upgrade to "starter" for always-on

    # Build: compile Vite client + esbuild server into dist/
    buildCommand: npm install && npm run build

    # Start: run the compiled server bundle
    startCommand: node dist/index.cjs

    # Health check — Render will restart the service if this fails
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render assigns this automatically; keep in sync
      - key: DATABASE_URL
        fromDatabase:
          name: qcare-db      # must match the database name below
          property: connectionString

# ── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: qcare-db
    databaseName: qcare
    user: qcare
    plan: free               # free tier: 1 GB storage, 97 hours/month active
    region: oregon           # must match the web service region
